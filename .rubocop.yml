plugins:
  - rubocop-md
  - rubocop-rake
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.4.7
  NewCops: enable

# Style -----------------------------------------------------------------------

Style/Documentation:
  Enabled: false

Style/RegexpLiteral:
  Enabled: false

# Layout ----------------------------------------------------------------------

Layout/LineLength:
  Max: 120

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/ClassStructure:
  Enabled: true
  Categories:
    module_inclusion:
      - include
      - prepend
      - extend
  ExpectedOrder:
    - module_inclusion
    - constants
    - public_class_methods
    - initializer
    - public_methods
    - private_methods
