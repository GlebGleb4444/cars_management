pre-commit:
  parallel: true
  jobs:
    - name: rubocop
      run: bundle exec rubocop --force-exclusion --format simple

    - name: bundler-audit
      run: bundle exec bundler-audit check --update

pre-push:
  parallel: true
  jobs:
    - name: rubocop
      run: bundle exec rubocop --force-exclusion --format simple

    - name: bundler-audit
      run: bundle exec bundler-audit check --update
